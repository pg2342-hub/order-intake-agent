name: Record a live run

# Calls Claude for every test email (reading the order, plus a handoff note for held ones) and the judge,
# saves the replies to recordings/, rebuilds the demo page from them, and commits both.
# Needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOLIVE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live run (3 runs of 30 emails, Claude reader + Claude judge)
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Set the ANTHROPIC_API_KEY repo secret first"; exit 1; }
          rm -f recordings/extractor.jsonl recordings/judge.jsonl
          set +e
          golive run evals/golive.live.yml --out reports/live
          code=$?
          set -e
          cat reports/live/report.md >> "$GITHUB_STEP_SUMMARY"
          # 0 go, 1 no-go, 2 partial are all results worth keeping; 3 is a config error
          test "$code" -ne 3
          # keep only a complete recording: no case may have crashed
          python - <<'PY'
          import json, sys
          r = json.load(open("reports/live/results.json"))
          errors = [(c["id"], run["error"]) for c in r["cases"] for run in c["runs"] if run["error"]]
          if errors:
              print("incomplete recording, not committing:", errors[:5]); sys.exit(1)
          PY
      - name: Commit the recording
        # committed before the page build, so a page-build error never loses a paid live run
        run: |
          cp reports/live/results.json recordings/live_results.json
          python - <<'PY'
          import json
          r = json.load(open("reports/live/results.json"))
          for c in r["cases"]:
              for i, run in enumerate(c["runs"], 1):
                  bad = {k: v["reason"] for k, v in run["verdicts"].items() if v["result"] == "fail"}
                  if bad:
                      print(c["id"], "run", i, json.dumps(bad)[:400])
          PY
          git config user.name "Pranav Gudise"
          git config user.email "273664482+pg2342-hub@users.noreply.github.com"
          git add recordings
          git commit -m "Record live run" || echo "nothing to commit"
          git push
      - name: Rebuild the demo page from the recording
        # replay only: with GOLIVE_LIVE unset the judge replays the recording instead of grading again
        run: |
          env -u GOLIVE_LIVE bash scripts/build_demo.sh
          git add docs
          git commit -m "Rebuild the demo page from the live run" || echo "nothing to commit"
          git push
